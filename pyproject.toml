[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carta-cc"
dynamic = ["version"]
description = "Semantic memory sidecar for Claude Code projects: doc audits, a local vector knowledge base, and proactive recall"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ian-q"}]
keywords = ["claude-code", "documentation", "rag", "semantic-search", "qdrant", "ollama", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "qdrant-client>=1.7",
    "requests>=2.31",
    "pymupdf>=1.23",
    # <2: mcp 2.0.0 (2026-07-28) removed the mcp.server.fastmcp module this
    # server imports. Lift the ceiling only together with a port to the 2.x API.
    "mcp>=1.7.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "openpyxl>=3.1"]
spreadsheet = ["openpyxl>=3.1"]
hybrid = [
    "fastembed>=0.4",
]
visual = [
    # colpali-engine dropped: its PEFT-based loader is broken on transformers>=5.x
    # (KeyError: 'llava' in _MOE_TARGET_MODULE_MAPPING).
    # We use the native transformers ColPaliForRetrieval/ColQwen2ForRetrieval API
    # introduced in transformers 4.49, which needs no PEFT adapters.
    "torch>=2.0.0",
    "transformers>=4.49.0",
    # transformers>=5.x routes from_pretrained(device_map=...) through accelerate,
    # which it no longer pulls in transitively — required for the device_map we pass
    # in colpali.py _load_model. Without it: ValueError "requires accelerate".
    "accelerate>=0.26.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/Ian-q/Carta"
Issues = "https://github.com/Ian-q/Carta/issues"
Changelog = "https://github.com/Ian-q/Carta/blob/main/CHANGELOG.md"

[project.scripts]
carta = "carta.cli:main"
carta-mcp = "carta.mcp.server:main"
carta-hook = "carta.hook.hook:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["carta*"]

[tool.setuptools.package-data]
"carta" = ["skills/*/SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "carta.__version__"}
