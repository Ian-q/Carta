- id: fp-et-embed-project-overview
  label: false_positive
  source: docs/audits/2026-06-09-comprehensive-system-audit.md
  section_text: '## Project Overview


    ET-embed is the embedded firmware and tooling for the Elementrailer project. The system uses:

    - **Teensy 4.1** (NXP i.MX RT1062, 600 MHz) for real-time CAN bus management and sensor integration

    - **Jetson Orin Nano 8GB** for high-level ROS2 orchestration and telemetry

    - **Two CAN buses** (MVP): CAN_A @ 500 kbps Intel/LE (GoldGun MCU), CAN_B @ 500 kbps Motorola/BE (CTS
    BMS, EVCC, GoldGun OBC, Safety MCU)'
  candidate_excerpt: '### 2.1 Compute topology and buses


    Three compute nodes plus supplier ECUs:


    - **Teensy 4.1 (i.MX RT1062) — the VCU.** Firmware at `firmware/vcu-testbench/` (native west, Zephyr
    pinned v4.0.0; renamed 2026-05-30 from `can-ads1263-loadcell-monitor/`, whose stale copy still exists
    and has diverged). This is the only node with actuation authority.

    - **Jetson Orin Nano 8GB — supervision and telemetry.** ROS2 Humble workspace (`ros2_ws/`): serial
    bridge node, CAN decoder, state estimator, policy engi'
