- id: tp-etembed-fsm
  label: true_positive
  source: docs/audits/2026-06-09-comprehensive-system-audit.md
  section_text: '### State Machine (FSM) — two-layer model


    The Teensy firmware implements a **two-layer FSM** (canonical reference: `docs/firmware/FSM_GAIN_SCHEDULER.md`).
    The flat `IDLE → READY → ASSISTING / CHARGING → ERROR` model described in older docs and in the patent
    (`docs/reference/patents/non-provisional-update-plan.md` §2.9) is historical — the patent draft predates
    the two-layer split. The firmware as built today is:


    **Top-level operational state** (`TncFsmState` in `firmware/vcu-testbench/src/fsm.h`):


    `INIT → STANDBY → ACTIVE → FAULT`


    Transitions: INIT → STANDBY on Zephyr boot; STANDBY → ACTIVE on bridge + CAN handshake; ACTIVE → FAULT
    on `can_bus_off` or `ads1263_dead`; FAULT → STANDBY on r'
  candidate_excerpt: The top-level FSM (INIT->STANDBY->ACTIVE->FAULT, fsm_top_level_update() at main.c:801-821)
    enters ACTIVE on the CAN handshake alone (CLAUDE.md's 'bridge + CAN handshake' is wrong) and exits
    only on controller BUS_OFF or boot-time ADS1263 failure. There is no message-staleness timeout and
    no watchdog.
- id: tp-etembed-bridge
  label: true_positive
  source: docs/audits/2026-06-09-comprehensive-system-audit.md
  section_text: '## Serial Bridge Architecture


    The `comms/` library implements a COBS+JSON serial bridge over LPUART8 (Teensy pins 20/21 ↔ Jetson
    `/dev/ttyTHS1` @ 921600 baud). The `microros/` directory is retained for reference but is **not active**.


    Key design notes:

    - UART RX is interrupt-driven (`uart_irq_callback_set` + `uart_fifo_read`) — avoids byte loss during
    CAN blocking waits

    - Inbound frames are COBS-decoded and dispatched in the comms thread (Zephyr priority 7, below CAN
    handler at 5)

    - Params from the Jetson are queued via `k_msgq` (`g_params_queue`) and consumed in the main loop
    — no mutex needed on the handoff path

    - `serial_bridge_link_active()` returns true after a valid handshake; gate C'
  candidate_excerpt: 'Firmware RX: UART ISR -> 1024-byte ring -> comms thread -> frame_parse -> bridge_handle_frame;
    params reach main() via k_msgq (g_scheduler_queue / g_cell_update_queue — CLAUDE.md''s g_params_queue
    no longer exists). TX is an ISR-drained 2048-byte ring.'
