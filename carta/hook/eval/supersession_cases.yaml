  section_text: "### `kicad-cli` (complementary to the KiCad GUI)\nInstalled with KiCad 9 (`/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli`).\n\
    Use it for scripted exports in CI: gerbers, drill files, the BOM CSV and the schematic PDF in one step. Example:\n\
    ```bash\nkicad-cli sch export bom hardware/node-v2/node.kicad_sch \\\n  --output hardware/node-v2/bom/node-bom.csv\n\
    ```\n**Does NOT run DRC fixes** — it only reports; layout changes still happen in the GUI."
  candidate_excerpt: '# Node v2 — BOM Tracker


    **Living document.** Records the decision behind every BOM line, not just

    the part number. When a part changes, append a row to the changelog at the

