- id: tp-demo-fsm
  label: true_positive
  source: docs/audits/2026-06-09-system-audit.md
  section_text: '### State Machine (FSM)


    The node firmware implements a **four-state FSM** (canonical reference: `docs/firmware/FSM.md`). The older `SLEEP
    → WAKE → SEND` loop in the original proposal is historical. The firmware as built today is:


    **Operational state** (`NodeState` in `firmware/node/main/fsm.h`):


    `BOOT → IDLE → SAMPLING → FAULT`


    Transitions: BOOT → IDLE after the power-on self-test; IDLE → SAMPLING on gateway link + sensor handshake; SAMPLING
    → FAULT on `rs485_timeout` or `probe_dead`; FAULT → IDLE on reset.'
  candidate_excerpt: The FSM (BOOT->IDLE->SAMPLING->FAULT, fsm_update() at main.c:412-440) enters SAMPLING on the
    sensor handshake alone (the docs' 'gateway link + sensor handshake' is wrong) and leaves it only on an RS-485
    timeout or a boot-time probe failure. There is no gateway-link timeout and no watchdog.
- id: tp-demo-bridge
  label: true_positive
  source: docs/audits/2026-06-09-system-audit.md
  section_text: '## Serial Link Architecture


    The `link/` component implements a COBS-framed serial link over UART1 (node ↔ gateway `/dev/ttyAMA0` @ 460800
    baud).


    Key design notes:

    - UART RX is interrupt-driven — avoids byte loss while the RS-485 poll blocks

    - Inbound frames are COBS-decoded and dispatched in the link task (priority 7, below the sensor task at 5)

    - Config updates from the gateway are queued via a FreeRTOS queue (`g_config_queue`) and consumed in the main
    loop — no mutex needed on the handoff path'
  candidate_excerpt: 'Firmware RX: UART ISR -> 1024-byte ring -> link task -> frame_parse -> link_handle_frame;
    config reaches main() via two queues (g_sample_rate_queue / g_calib_queue — the docs'' g_config_queue no longer
    exists). TX is an ISR-drained 2048-byte ring.'
- id: fp-doc-audit-cc-runtime
  label: false_positive
  source: docs/quirks/2026-06-11-pypi-index-lag-after-release-tagging.md
  section_text: '## Runtime

    - Python 3.10 or later (specified in `pyproject.toml`)

    - pip / setuptools (modern Python packaging)

    - Lockfile: Not detected (uses direct `pyproject.toml` dependencies)'
  candidate_excerpt: Right after a release is tagged, PyPI's simple index can lag for a minute — 'pipx upgrade carta-cc'
    may report 'already latest' while the GitHub Release and pypi.org JSON already show the new version. Use 'pipx
    install --force carta-cc==X.Y.Z' to pin the explicit version instead of waiting.
