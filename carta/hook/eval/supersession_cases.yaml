# The project in the non-Carta cases ("Tidewatch", a sensor buoy) is fictional; each case mirrors the shape of a real
# false or true positive met while tuning the judge.
- id: fp-demo-project-overview
  label: false_positive
  source: docs/audits/2026-06-09-system-audit.md
  section_text: '## Project Overview


    Tidewatch is the firmware and tooling for a moored ocean-sensor buoy. The system uses:

    - **ESP32-S3** sensor node for sampling, power management and the RS-485 sensor bus

    - **Raspberry Pi 5** gateway for logging, the cellular uplink and over-the-air updates

    - **One RS-485 bus** (MVP) @ 115200 baud: conductivity probe, temperature string, wave IMU'
  candidate_excerpt: '### 2.1 Compute topology and buses


    Two compute nodes plus sensor modules:


    - **ESP32-S3 — the sensor node.** Firmware at `firmware/node/` (ESP-IDF v5.3). Owns the RS-485 bus and the power
    switches; the only node that can cut sensor power.

    - **Raspberry Pi 5 — gateway.** Python services under `gateway/`: serial link to the node, SQLite logger, cellular
    uplink, OTA server.

    - **RS-485 @ 115200 baud** to the conductivity probe, the 8-sensor temperature string and the wave IMU.'
