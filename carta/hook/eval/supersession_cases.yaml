  section_text: '### CLI — `carta <command>` (or `python -m carta <command>`)


    | Command | Purpose |

    |---------|---------|

    | `init` | Bootstrap Carta in a repo (config, collections, skills, hook) |

    | `scan` | Structural doc scan → `.carta/scan-results.json` (no LLM) |

    | `embed` | Extract/chunk/embed pending docs → Qdrant. `--visual` drains image-heavy pages (two-pass); `--repair`
    re-embeds damaged points |

    | `search` | Hybrid (BM25 + dense, RRF) semantic search |

    | `focus` | Deep retrieval scoped to **one file**: page-anchored passages, an outline (omit query), and table/figure
    pages as images. Two-step partner to `search` (locate → go deep) |

    | `audit` | Embed-pipeline **data integrity** check → JSON |

