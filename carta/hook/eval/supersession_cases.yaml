  label: false_positive
  source: docs/sddv4/bom-tracker.md
  section_text: "### `easyeda2kicad` (CLI, complementary to the MCP)\nAlready installed at `/Library/Frameworks/Python.framework/Versions/3.12/bin/easyeda2kicad`\
    \ (v1.0.1).\nUse for per-part fetches from LCSC: symbol + footprint + 3D STEP/WRL in one command.\
    \ Faster than the MCP for one-off parts. Example:\n```bash\ncd hardware/SDD_v4\neasyeda2kicad --lcsc_id\
    \ C2981446 C89334 --full \\\n  --output lib/SDD_v4.kicad_sym --use-cache --overwrite\n```\n**Does\
    \ NOT convert EasyEDA Pro projects to KiCad** — only individual parts. v4 schematic/layout is from\
    \ scratch."
  candidate_excerpt: '# SDDv4 — BOM Tracker


    **Living document.** Records the decision behind every BOM line, not just

    the part number. When a part changes, append a row to the changelog at the

    bottom rather than overwriting silently.


    The exported BOM CSV per revision lives at

    [`../../hardware/SDD_v4/bom/`](../../hardware/SDD_v4/bom/). This file is

    the *decision record* that shapes that CSV.


    **Cost target:** $1.50 total system BOM at 5 k qty (see

    [`cost-model.md`](cost-model.md)).


    **KiCad parts library:** 12 parts'
